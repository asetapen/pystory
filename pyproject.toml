[project]
name = "pystory"
version = "0.1.0"
description = "Screenshot and webcam capture with face detection and screen locking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Setapen", email = "asetapen@gmail.com" }]
dependencies = [
    "opencv-python>=4.10",
    "mss>=9.0",
    "pillow>=10.0",
    "face_recognition>=1.3",
    "setuptools<82",
]

[project.scripts]
pystory = "pystory.main:main"
pystory-timelapse = "pystory.timelapse:main"
pystory-enroll = "pystory.enroll:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pystory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
